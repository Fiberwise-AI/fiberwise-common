# Integration test infrastructure for fiberwise-common.
# Uses non-default ports to avoid conflicts with local dev services.
#
# Usage:
#   docker compose -f tests/docker-compose.test.yml up -d
#   pytest tests/integration/ -v
#   docker compose -f tests/docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fiberwise_test
      POSTGRES_PASSWORD: fiberwise_test
      POSTGRES_DB: fiberwise_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberwise_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./fixtures/keycloak-test-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
