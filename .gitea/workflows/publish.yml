name: Build & Publish

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fiberwise_test
          POSTGRES_PASSWORD: fiberwise_test
          POSTGRES_DB: fiberwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiberwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql://fiberwise_test:fiberwise_test@localhost:5432/fiberwise_test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3.11 -m pip install --user ".[test]"
          python3.11 -m pip install --user pytest pytest-asyncio pytest-cov bcrypt

      - name: Run unit tests
        run: python3.11 -m pytest tests/unit/ -v --tb=short --no-cov

      - name: Run integration tests (SQLite + PostgreSQL)
        run: python3.11 -m pytest tests/integration/ -v --tb=short --no-cov

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3.11 -m pip install --user build twine

      - name: Build wheel with dev version
        run: |
          # Append timestamp so every push produces a unique version
          # e.g. 0.1.0 -> 0.1.0.dev20260126073500
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/^version = \"\\(.*\\)\"/version = \"\\1.dev${TIMESTAMP}\"/" pyproject.toml
          python3.11 -m build --wheel

      - name: Publish to Gitea package registry
        env:
          TWINE_USERNAME: ${{ secrets.PKG_REGISTRY_USER }}
          TWINE_PASSWORD: ${{ secrets.PKG_REGISTRY_PASSWORD }}
          TWINE_REPOSITORY_URL: http://localhost:3000/api/packages/fiberwise/pypi
        run: python3.11 -m twine upload dist/*.whl
