name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # Dev builds → Gitea registry (on every push to main)
  publish-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install --user build twine

      - name: Build wheel with dev version
        run: |
          # Append timestamp so every push produces a unique version
          # e.g. 0.1.0 -> 0.1.0.dev20260126073500
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/^version = \"\(.*\)\"/version = \"\1.dev${TIMESTAMP}\"/" pyproject.toml
          python3 -m build --wheel

      - name: Publish to Gitea package registry
        env:
          TWINE_USERNAME: ${{ secrets.PKG_REGISTRY_USER }}
          TWINE_PASSWORD: ${{ secrets.PKG_REGISTRY_PASSWORD }}
          TWINE_REPOSITORY_URL: http://localhost:3000/api/packages/Fiberwise-AI/pypi
        run: python3 -m twine upload --non-interactive --verbose dist/*.whl

  # Release builds → Public PyPI (on version tags only)
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install --user build twine

      - name: Build wheel
        run: python3 -m build

      - name: Check package
        run: python3 -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python3 -m twine upload --non-interactive dist/*
